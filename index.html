<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LSBRCY Duty Tracker — Sign In</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="container" style="max-width:420px; margin-top:12vh;">
    <div style="text-align:center; margin-bottom:24px;">
      <div class="topbar__logo" style="width:56px;height:56px;background:var(--red);border-radius:14px;display:inline-flex;align-items:center;justify-content:center;font-size:26px;margin-bottom:12px;">❤️</div>
      <h2 style="margin-bottom:2px;">LSBRCY Duty Tracker</h2>
      <p class="muted">Lasalian Serviam Brigade – Red Cross Youth</p>
    </div>

    <div class="card">
      <h3>Sign In</h3>
      <input id="username" type="text" placeholder="Username" autocomplete="username">
      <input id="password" type="password" placeholder="Password" autocomplete="current-password">
      <div class="error" id="error"></div>
      <button class="primary" id="loginBtn" style="width:100%;">Sign In</button>
      <button onclick="fetch('https://firestore.googleapis.com/v1/projects/lsb-rcy-duty-tracker/databases/%28default%29/documents/users').then(r=>r.text()).then(t=>document.getElementById('rawtest').textContent=t).catch(e=>document.getElementById('rawtest').textContent='FETCH ERROR: '+e.message)" style="margin-top:10px;width:100%;">Test Raw Connection</button>
      <pre id="rawtest" style="white-space:pre-wrap;font-size:11px;color:#9a9ba0;margin-top:10px;"></pre>

    </div>
    <p class="muted" style="text-align:center;">Accounts are created by an admin. Contact your committee head if you don't have one yet.</p>
  </div>

<script type="module" src="js/auth.js"></script>
</body>
</html>
