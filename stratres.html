<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Duty Records — LSBRCY Duty Tracker</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="topbar">
    <div class="logo">☘︎</div>
    <h1>LSBRCY Duty Tracker <span style="color:var(--muted);font-weight:400;">· Strategic Response</span></h1>
    <div class="spacer"></div>
    <button class="signout" id="signOutBtn">Sign out</button>
  </div>

  <div class="container">
    <div class="tabs" id="mainTabs">
      <button class="active" data-tab="records">Duty Records</button>
      <button data-tab="events">Events</button>
    </div>

    <!-- DUTY RECORDS -->
    <div id="tab-records">
      <div class="card">
        <input id="memberSearch" placeholder="Search by name or student no...">
      </div>
      <div class="tabs" id="eventSubTabs"></div>
      <div id="recordsList"></div>
      <div id="memberDetail"></div>
    </div>

    <!-- EVENTS (view-only) -->
    <div id="tab-events" style="display:none;">
      <div class="tabs" id="evStatusTabs">
        <button data-status="active" class="active">Active</button>
        <button data-status="completed">Completed</button>
        <button data-status="all">All</button>
      </div>
      <div class="tabs" id="evCategoryFilterTabs">
        <button data-cat="all" class="active">All Categories</button>
        <button data-cat="clinic">Clinic Duty</button>
        <button data-cat="office">Office Duty</button>
      </div>
      <div id="eventsList"></div>
    </div>
  </div>

<script type="module" src="js/stratres.js"></script>
</body>
</html>
