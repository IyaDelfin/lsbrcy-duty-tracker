<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="format-detection" content="telephone=no, date=no, address=no, email=no">
<title>My Duty Hours — LSBRCY Duty Tracker</title>
<link rel="stylesheet" href="css/styles.css">
<style>
  /* ===== Member page polish (self-contained; no changes to styles.css needed) ===== */
  .dot { display:inline-block; width:7px; height:7px; border-radius:50%; background:currentColor; margin-right:6px; vertical-align:middle; }
  .dot.live { animation: memPulse 1.4s ease-in-out infinite; }
  @keyframes memPulse { 0%,100% { opacity:1; } 50% { opacity:.3; } }

  .loc-pill { display:inline-block; background:rgba(217,51,46,.15); color:var(--red); padding:1px 8px; border-radius:6px; font-size:.75rem; font-weight:700; margin-left:6px; }
  .sec-head { display:flex; justify-content:space-between; align-items:baseline; gap:10px; flex-wrap:wrap; margin-bottom:12px; }
  .sec-sub { color:var(--muted); font-size:.8rem; }
  .empty-state { text-align:center; color:var(--muted); font-size:.9rem; padding:18px 10px; border:1px dashed var(--border); border-radius:12px; }
  .empty-state span { font-size:.78rem; }

  /* profile / hero */
  .hero-meta { display:flex; flex-wrap:wrap; gap:6px; margin:0 0 16px; }
  .hero-chip { background:var(--card-2); border:1px solid var(--border); color:var(--muted); font-size:.75rem; padding:3px 10px; border-radius:999px; }
  .hero-stats { display:flex; gap:10px; }
  .hero-stats .stat { flex:1; background:var(--card-2); border:1px solid var(--border); border-radius:12px; padding:14px 8px; }
  .hero-stats .num { font-size:2rem; }

  /* clock-in card */
  .clock-top { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  .clock-title { font-size:1.2rem; margin:10px 0 8px; }
  .clock-timer { font-size:2.6rem; font-weight:700; letter-spacing:.02em; font-variant-numeric:tabular-nums; text-align:center; margin:12px 0 0; }
  .clock-timer-label { text-align:center; color:var(--muted); font-size:.72rem; text-transform:uppercase; letter-spacing:.08em; margin-bottom:12px; }
  .clock-line { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:8px 0; border-top:1px solid var(--border); font-size:.88rem; }
  .clock-line span { color:var(--muted); }
  .clock-line strong { text-align:right; }
  .clock-note { margin-top:10px; padding:8px 12px; border-radius:8px; font-size:.82rem; font-weight:600; }
  .clock-note.orange { background:rgba(255,159,10,.12); color:var(--orange); border-left:3px solid var(--orange); }
  .clock-note.red { background:rgba(217,51,46,.12); color:var(--red); border-left:3px solid var(--red); }
  .clock-empty { color:var(--muted); font-size:.9rem; margin:12px 0 4px; }
  .clock-next { margin-top:12px; padding:10px 12px; border:1px solid var(--border); border-radius:10px; background:var(--card-2); font-size:.85rem; }
  .clock-next span { display:block; color:var(--muted); font-size:.68rem; text-transform:uppercase; letter-spacing:.07em; margin-bottom:3px; }
  .clock-next strong { display:block; margin-bottom:3px; }
  #clockBtn { margin-top:14px; padding:15px 18px; font-size:1.05rem; }

  /* this week's reservations */
  .res-item { display:flex; align-items:center; gap:12px; padding:12px; margin-bottom:8px; border:1px solid var(--border); border-radius:12px; background:var(--card-2); }
  .res-item.today { border-color:var(--red); background:rgba(217,51,46,.07); }
  .res-date { flex:0 0 46px; text-align:center; line-height:1.1; }
  .res-date span { display:block; font-size:.66rem; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); }
  .res-date strong { font-size:1.5rem; }
  .res-main { flex:1; min-width:0; }
  .res-title { font-weight:700; font-size:.95rem; overflow-wrap:anywhere; }
  .res-sub { color:var(--muted); font-size:.8rem; margin-top:3px; }
  .res-side { display:flex; flex-direction:column; align-items:flex-end; gap:6px; flex:0 0 auto; }
  .res-cancel { width:auto; margin:0; padding:4px 10px; font-size:.72rem; }

  /* my duty logs */
  .mini-stats { display:flex; gap:8px; margin:4px 0 12px; }
  .mini-stat { flex:1; text-align:center; background:var(--card-2); border:1px solid var(--border); border-radius:10px; padding:8px 4px; }
  .mini-stat strong { display:block; font-size:1.2rem; }
  .mini-stat span { color:var(--muted); font-size:.7rem; }
  .log-total { color:var(--muted); font-size:.82rem; margin:0 0 8px; }
  .log-total strong { color:var(--text); }
  .log-row { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; padding:12px 0; border-top:1px solid var(--border); }
  .log-main { min-width:0; flex:1; }
  .log-title { font-weight:700; font-size:.95rem; overflow-wrap:anywhere; }
  .log-sub { color:var(--muted); font-size:.8rem; margin-top:2px; }
  .log-chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .log-hrs { text-align:right; flex:0 0 auto; }
  .log-hrs strong { display:block; font-size:1.35rem; line-height:1; }
  .log-hrs span { color:var(--muted); font-size:.7rem; }

  /* announcements: ✉ button, banner, inbox panel */
  .topbar { position:sticky; top:0; z-index:40; background:var(--bg); }
  .mail-btn { position:relative; background:none; border:1px solid var(--border); color:var(--text); border-radius:50%;
    width:38px; height:38px; padding:0; font-size:1.1rem; line-height:1; display:inline-flex; align-items:center; justify-content:center; }
  .mail-btn.has-unread { border-color:var(--red); }
  .mail-badge { position:absolute; top:-5px; right:-5px; min-width:18px; height:18px; padding:0 5px; border-radius:999px;
    background:var(--red); color:#fff; font-size:.68rem; font-weight:700; display:flex; align-items:center; justify-content:center; }
  .mail-badge[hidden] { display:none; }
  .mail-btn.has-unread::after { content:""; position:absolute; inset:-4px; border-radius:50%; border:2px solid var(--red);
    opacity:0; animation: mailPing 1.8s ease-out infinite; pointer-events:none; }
  @keyframes mailPing { 0% { transform:scale(.85); opacity:.7; } 100% { transform:scale(1.35); opacity:0; } }

  .ann-banner { display:flex; gap:12px; align-items:flex-start; background:rgba(217,51,46,.08); border:1px solid rgba(217,51,46,.35);
    border-left:4px solid var(--red); border-radius:var(--radius); padding:14px 16px; margin-bottom:16px; }
  .ann-banner__icon { font-size:1.3rem; line-height:1.2; }
  .ann-banner__body { min-width:0; flex:1; }
  .ann-banner__label { font-size:.68rem; text-transform:uppercase; letter-spacing:.07em; color:var(--red); font-weight:700; margin-bottom:4px; }
  .ann-banner__text { font-size:.95rem; font-weight:600; white-space:pre-wrap; overflow-wrap:anywhere; }
  .ann-banner__more { background:none; border:none; color:var(--muted); padding:6px 0 0; font-size:.78rem; font-weight:600; text-decoration:underline; }

  .mail-panel { position:fixed; top:66px; right:12px; width:min(380px, calc(100vw - 24px)); max-height:70vh; overflow-y:auto; z-index:50;
    background:var(--card); border:1px solid var(--border); border-radius:14px; box-shadow:0 12px 40px rgba(0,0,0,.55); }
  .mail-panel[hidden] { display:none; }
  .mail-panel__head { display:flex; justify-content:space-between; align-items:center; padding:14px 16px; border-bottom:1px solid var(--border);
    position:sticky; top:0; background:var(--card); }
  .mail-panel__close { background:none; border:none; color:var(--muted); padding:4px 8px; font-size:1rem; }
  .mail-item { padding:14px 16px; border-bottom:1px solid var(--border); }
  .mail-item:last-child { border-bottom:none; }
  .mail-item.is-new { background:rgba(217,51,46,.07); box-shadow:inset 3px 0 0 var(--red); }
  .mail-item__text { font-size:.9rem; white-space:pre-wrap; overflow-wrap:anywhere; }
  .mail-item__meta { color:var(--muted); font-size:.72rem; margin-top:6px; }
  .mail-empty { color:var(--muted); text-align:center; padding:26px 16px; font-size:.88rem; }
</style>
</head>
<body>
  <div class="topbar">
    <div class="logo">🩸</div>
    <h1>LSBRCY Duty Tracker</h1>
    <div class="spacer"></div>
    <button class="mail-btn" id="mailBtn" type="button" aria-label="Announcements">✉︎<span class="mail-badge" id="mailBadge" hidden></span></button>
    <button class="signout" id="signOutBtn">Sign out</button>
  </div>

  <div class="mail-panel" id="mailPanel" hidden></div>

  <div class="container">
    <div id="announceBanner"></div>
    <div class="card">
      <h2 id="memberName" style="margin-bottom:6px;">–</h2>
      <div class="hero-meta" id="memberMetaChips"></div>
      <div class="hero-stats">
        <div class="stat"><div class="num" id="totalHours">–</div><div class="label">Total Hours</div></div>
        <div class="stat"><div class="num" id="shiftCount">–</div><div class="label">Shifts Completed</div></div>
      </div>
    </div>

    <div class="card" id="clockCard">
      <h3>Clock In / Out</h3>
      <div id="clockStatus"></div>
      <div class="error" id="clockError" style="margin:10px 0 0;"></div>
      <button class="primary" id="clockBtn" style="width:100%;" disabled>Clock In</button>
    </div>

    <div class="card" id="weeklyCard">
      <div id="weeklyReservations"></div>
    </div>

    <div class="card">
      <h3>Available Events</h3>
      <p class="muted">Tap a category, then tap an event to see its details and select it.</p>
      <div class="tabs" id="categoryTabs">
        <button data-cat="clinic" class="active">Clinic Duty</button>
        <button data-cat="office">Office Duty</button>
      </div>
      <div id="categoryEventsList"></div>
      <div id="eventDetails"></div>
      <div id="dateChoice"></div>
    </div>

    <div class="card">
      <h3>My Duty Logs</h3>
      <div class="tabs" id="eventSubTabs"></div>
      <div id="recordsList"></div>
    </div>
  </div>

<script type="module" src="js/member.js"></script>
</body>
</html>
